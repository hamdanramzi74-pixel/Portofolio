<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portofolio — Contact</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="noise"></div>

<header>
  <div class="logo">KAISEI SADATOKI<span>Web Design / Development</span></div>
  <nav>
    <a href="index.html">Top</a>
    <a href="about.html">About</a>
    <a href="work.html">Work</a>
    <a href="contact.html" class="active">Contact</a>
  </nav>
</header>

<main>
<section>
  <div class="section-head">
    <h2>CONTACT</h2>
    <div class="count">Let's talk</div>
  </div>
  <div class="contact-grid">
    <div>
      <p class="desc">Punya proyek yang ingin dikerjakan bersama? Kirim pesan dan mari kita mulai obrolannya.</p>
      <div class="info-block"><label>Address</label><div>Jl. Melati No. 21, Bandung</div></div>
      <div class="info-block"><label>Phone</label><div>+62 812 3456 7890</div></div>
      <div class="info-block"><label>E-mail</label><div>hello@kaisei.dev</div></div>
    </div>
    <div class="form">
      <h3>Contact Form</h3>
      <form action="#" method="post">
        <div class="field"><input type="text" name="name" placeholder="Your name"></div>
        <div class="field"><input type="tel" name="phone" placeholder="Your phone"></div>
        <div class="field"><input type="email" name="email" placeholder="Your e-mail"></div>
        <div class="field"><textarea name="message" rows="3" placeholder="Message"></textarea></div>
        <button type="submit" class="send-btn">Send Message →</button>
      </form>
    </div>
  </div>
</section>
</main>

<footer>
  <div>© 2026 Kaisei Sadatoki</div>
  <a href="mailto:hello@kaisei.dev">hello@kaisei.dev</a>
</footer>

</body>
</html>
